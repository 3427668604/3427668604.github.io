<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人页面</title>
    <style>
        /* 重置默认边距 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #a8d8a8 0%, #5cb8c5 50%, #2a5bb5 100%);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 个人卡片容器 */
        .card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 45px 50px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 440px;
            width: 90%;
        }

        /* 头像容器 */
        .avatar-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #a8d8a8, #2a5bb5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.8);
        }

        /* 标题 */
        h1 {
            color: #ffffff;
            font-size: 1.6rem;
            margin-bottom: 6px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            font-weight: 600;
        }

        /* 分隔线 */
        .divider {
            width: 60px;
            height: 3px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            margin: 12px auto;
        }

        /* 名字 */
        .name {
            color: #f0f8ff;
            font-size: 2rem;
            letter-spacing: 12px;
            padding: 8px 20px;
            margin-left: 12px;
            font-weight: 700;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.25);
        }

        /* 简介区域 */
        .bio {
            margin-top: 22px;
            text-align: left;
        }

        .bio-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 3px;
        }

        /* 联系信息条目 */
        .contact-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: translateX(4px);
        }

        /* 图标 */
        .contact-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 14px;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .icon-email {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .icon-qq {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .icon-kuaishou {
            background: linear-gradient(135deg, #ff9a56, #ff6a00);
        }

        /* 联系文字 */
        .contact-label {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.8rem;
            margin-bottom: 1px;
        }

        .contact-value {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .contact-text {
            text-align: left;
        }

        /* 底部 */
        .footer-text {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
            }

            .name {
                font-size: 1.7rem;
            }

            .contact-item {
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 头像 -->
        <div class="avatar-wrapper">
            <img src="avatar.png" alt="骆明辉的头像">
        </div>

        <!-- 标题 -->
        <h1>我的个人页面</h1>

        <!-- 分隔线 -->
        <div class="divider"></div>

        <!-- 名字 -->
        <div class="name">骆明辉</div>

        <!-- 个人简介 -->
        <div class="bio">
            <div class="bio-title">📋 个人简介</div>

            <!-- 邮箱 -->
            <div class="contact-item">
                <div class="contact-icon icon-email">✉</div>
                <div class="contact-text">
                    <div class="contact-label">邮箱</div>
                    <div class="contact-value">mrldfy78@outlook.com</div>
                </div>
            </div>

            <!-- QQ -->
            <div class="contact-item">
                <div class="contact-icon icon-qq">Q</div>
                <div class="contact-text">
                    <div class="contact-label">QQ 号</div>
                    <div class="contact-value">3427668604</div>
                </div>
            </div>

            <!-- 快手 -->
            <div class="contact-item">
                <div class="contact-icon icon-kuaishou">K</div>
                <div class="contact-text">
                    <div class="contact-label">快手号</div>
                    <div class="contact-value">m154dl666</div>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer-text">Welcome to My Page ✦</div>
    </div>
</body>
</html>
