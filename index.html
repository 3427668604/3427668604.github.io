<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你辉哥</title>
    <!-- 主题预执行脚本，防止闪烁 -->
    <script>
        (function(){
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if(saved){
                document.documentElement.dataset.theme = saved;
            }else if(prefersDark){
                document.documentElement.dataset.theme = 'dark';
            }
        })();
    </script>
    <style>
        :root{
            --bg-gradient-light: linear-gradient(-45deg, #4158D0, #C850C0, #4CC9F0, #63D4A8);
            --bg-gradient-dark: linear-gradient(-45deg, #141e30, #243b55, #1f2c40, #101828);
            --card-bg-light: rgba(255, 255, 255, 0.14);
            --card-bg-dark: rgba(0,0,0,0.28);
            --card-border-light: rgba(255, 255, 255, 0.25);
            --card-border-dark: rgba(255,255,255,0.12);
            --item-bg-light: rgba(255, 255, 255, 0.10);
            --item-bg-dark: rgba(255,255,255,0.06);
            --item-hover-light: rgba(255, 255, 255, 0.20);
            --item-hover-dark: rgba(255,255,255,0.14);
            --text-white: #ffffff;
            --text-sub-light: rgba(255, 255, 255, 0.62);
            --text-sub-dark: rgba(255,255,255,0.55);
            --transition-theme: background 0.4s ease, background‑color 0.4s ease;
        }
        /* 重置默认边距 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient-light);
            background-size: 400% 400%;
            animation: bgFlow 14s ease infinite;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            transition: var(--transition-theme);
        }
        html[data-theme="dark"] body{
            background: var(--bg-gradient-dark);
            background-size:400% 400%;
        }
        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 主题切换按钮 */
        .theme-toggle{
            position:absolute;
            top:16px;
            right:16px;
            background:rgba(255,255,255,0.16);
            backdrop-filter: blur(8px);
            border:1px solid rgba(255,255,255,0.22);
            width:42px;
            height:42px;
            border-radius:50%;
            color:#fff;
            font-size:1.2rem;
            cursor:pointer;
            transition:0.3s ease;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .theme-toggle:hover{
            transform:scale(1.08);
            background:rgba(255,255,255,0.26);
        }
        /* 个人卡片容器 优化玻璃质感 */
        .card {
            position:relative;
            background: var(--card-bg-light);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 48px 52px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
            border: 1px solid var(--card-border-light);
            max-width: 480px;
            width: 92%;
            transition: transform 0.32s ease, var(--transition-theme), border‑color 0.3s;
        }
        html[data-theme="dark"] .card{
            background:var(--card-bg-dark);
            border-color:var(--card-border-dark);
        }
        .card:hover{
            transform: translateY(-4px);
        }
        /* 头像容器，增加微动动画 */
        .avatar-wrapper {
            width: 124px;
            height: 124px;
            margin: 0 auto 22px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #63D4A8, #4158D0);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
            animation: avatarPulse 5s ease-in-out infinite;
        }
        @keyframes avatarPulse {
            0%,100%{transform: scale(1);}
            50%{transform: scale(1.025);}
        }
        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.85);
        }
        /* 标题 */
        h1 {
            color: var(--text-white);
            font-size: 1.55rem;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
            font-weight: 500;
        }
        /* 分隔线 */
        .divider {
            width: 72px;
            height: 3px;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 99px;
            margin: 14px auto 18px;
        }
        /* 名字：修复过大字间距、多余margin-left */
        .name {
            color: var(--text-white);
            font-size: 2.1rem;
            letter-spacing: 6px;
            padding: 8px 20px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        /* 简介区域 */
        .bio {
            margin-top: 26px;
            text-align: left;
        }
        .bio-title {
            color: rgba(255, 255, 255, 0.92);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 4px;
        }
        /* 联系信息条目 */
        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            margin-bottom: 10px;
            background: var(--item-bg-light);
            border-radius: 14px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }
        html[data-theme="dark"] .contact-item{
            background:var(--item-bg-dark);
        }
        .contact-item:hover {
            background: var(--item-hover-light);
            transform: translateY(-3px);
            border-color: rgba(255,255,255,0.25);
        }
        html[data-theme="dark"] .contact-item:hover{
            background:var(--item-hover-dark);
        }
        /* 图标 */
        .contact-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 16px;
            font-size: 1.2rem;
            flex-shrink: 0;
            color:#fff;
        }
        .icon-phone {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }
        .icon-email {
            background: linear-gradient(135deg, #f77062, #fe5196);
        }
        .icon-qq {
            background: linear-gradient(135deg, #2196F3, #03A9F4);
        }
        .icon-douyin {
            background: linear-gradient(135deg, #000000, #25F4EE);
        }
        .icon-kuaishou {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
        }
        .icon-wechat-mp {
            background: linear-gradient(135deg, #74b9ff, #00cec9);
        }
        .icon-video-page{
            background: linear-gradient(135deg,#e53935,#ffb74d);
        }
        /* 联系文字 */
        .contact-label {
            color: var(--text-sub-light);
            font-size: 0.82rem;
            margin-bottom: 2px;
        }
        html[data-theme="dark"] .contact-label{
            color:var(--text-sub-dark);
        }
        .contact-value {
            color: var(--text-white);
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.4px;
        }
        .contact-text {
            text-align: left;
        }
        /* Toast复制提示 */
        .toast {
            position: fixed;
            left: 50%;
            top: 48%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.65);
            color:#fff;
            padding:10px 22px;
            border-radius:8px;
            font-size:0.9rem;
            opacity:0;
            pointer-events:none;
            transition: opacity 0.25s ease;
            z-index:999;
        }
        .toast.show{
            opacity:1;
        }
        /* 底部 */
        .footer-text {
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.52);
            font-size: 0.82rem;
            letter-spacing: 2.5px;
        }
        .footer-text a{
            color: inherit;
            text-decoration: none;
        }
        .footer-text a:hover{
            color: rgba(255,255,255,0.85);
            text-decoration: underline;
        }
        /* 响应式 */
        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }
            .name {
                font-size: 1.7rem;
                letter-spacing:4px;
            }
            .avatar-wrapper{
                width:110px;
                height:110px;
            }
            .contact-item {
                padding:10px 14px;
            }
            .contact-icon{
                width:36px;
                height:36px;
            }
            .theme-toggle{
                width:38px;
                height:38px;
                font-size:1rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <button class="theme-toggle" id="themeBtn">🌙</button>
        <!-- 头像 -->

        <!-- 标题 -->

        <!-- 分隔线 -->

        <!-- 个人简介 -->
        <div class="bio">

            <!-- 手机号 -->
            <div class="contact-item" data-copy="18054385320">

            <!-- 邮箱 -->
            <div class="contact-item" data-copy="mrldfy78@outlook.com">

            <!-- QQ -->
            <div class="contact-item" data-copy="3427668604">

            <!-- 抖音 -->
            <div class="contact-item" data-copy="93973297876">
                <div class="contact-icon icon-douyin">🎵</div>
                <div class="contact-text">

            <div class="contact-item" data-copy="m154dl666">

            <!-- 新增：跳转到main.html -->
            <a href="main.html" target="_blank" style="text-decoration:none;">
                <div class="contact-item">

                    <div class="contact-text">
                        <div class="contact-label">视频页面</div>

        <!-- 底部 增加超链接 target="_blank"新窗口打开GitHub -->
        <div class="footer-text">
            <a href="https://www.github.com/3427668604" target="_blank">LuoMH</a>
        </div>
    </div>
    <!--复制提示弹窗-->
    <div class="toast">复制成功</div>
<script>
    const toast = document.querySelector('.toast');
    const items = document.querySelectorAll('.contact-item[data-copy]');
    const themeBtn = document.getElementById('themeBtn');
    const htmlRoot = document.documentElement;
    // 同步按钮图标
    function syncThemeIcon(){
        if(htmlRoot.dataset.theme === 'dark'){
            themeBtn.textContent = '☀';
        }else{
            themeBtn.textContent = '🌙';
        }
    }
    syncThemeIcon();
    // 切换主题
    themeBtn.addEventListener('click',()=>{
        if(htmlRoot.dataset.theme === 'dark'){
            htmlRoot.removeAttribute('data-theme');
            localStorage.removeItem('theme');
        }else{
            htmlRoot.dataset.theme = 'dark';
            localStorage.setItem('theme','dark');
        }
        syncThemeIcon();
    })
    // 监听系统主题实时变化（用户系统设置中途改变）
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{
        if(!localStorage.getItem('theme')){
            if(e.matches){
                htmlRoot.dataset.theme = 'dark';
            }else{
                htmlRoot.removeAttribute('data-theme');
            }
            syncThemeIcon();
        }
    })
    function showToast(text){
        toast.innerText = text;
        toast.classList.add('show');
        setTimeout(()=>{
            toast.classList.remove('show');
        },1200);
    }
    items.forEach(item=>{
        item.addEventListener('click',async ()=>{
            const copyText = item.dataset.copy;
            try{
                await navigator.clipboard.writeText(copyText);
                showToast("复制成功 ✔");
            }catch(err){
                // 兼容旧浏览器降级方案
                const temp = document.createElement('textarea');
                temp.value = copyText;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                showToast("复制成功 ✔");
            }
        })
    })
</script>
</body>
</html>
