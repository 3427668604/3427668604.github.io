<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个人页面</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 让内容垂直水平都居中 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        p {
            color: #f8f8f8;
            font-size: 2rem;
            letter-spacing: 8px; /* 三个字间距更舒服 */
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <h1>我的个人页面</h1>
    <p>骆明辉</p>
</body>
</html>
