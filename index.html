<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人页面</title>
    <style>
        /* 重置默认边距 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 优化背景渐变 + 流动动画 */
            background: linear-gradient(-45deg, #4158D0, #C850C0, #4CC9F0, #63D4A8);
            background-size: 400% 400%;
            animation: bgFlow 14s ease infinite;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        @keyframes bgFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 个人卡片容器 优化玻璃质感 */
        .card {
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 48px 52px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
            max-width: 480px;
            width: 92%;
            transition: transform 0.32s ease;
        }
        .card:hover{
            transform: translateY(-4px);
        }
        /* 头像容器，增加微动动画 */
        .avatar-wrapper {
            width: 124px;
            height: 124px;
            margin: 0 auto 22px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #63D4A8, #4158D0);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
            animation: avatarPulse 5s ease-in-out infinite;
        }
        @keyframes avatarPulse {
            0%,100%{transform: scale(1);}
            50%{transform: scale(1.025);}
        }
        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.85);
        }
        /* 标题 */
        h1 {
            color: #ffffff;
            font-size: 1.55rem;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
            font-weight: 500;
        }
        /* 分隔线 */
        .divider {
            width: 72px;
            height: 3px;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 99px;
            margin: 14px auto 18px;
        }
        /* 名字：修复过大字间距、多余margin-left */
        .name {
            color: #ffffff;
            font-size: 2.1rem;
            letter-spacing: 6px;
            padding: 8px 20px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        /* 简介区域 */
        .bio {
            margin-top: 26px;
            text-align: left;
        }
        .bio-title {
            color: rgba(255, 255, 255, 0.92);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 4px;
        }
        /* 联系信息条目 */
        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.10);
            border-radius: 14px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .contact-item:hover {
            background: rgba(255, 255, 255, 0.20);
            transform: translateY(-3px);
            border-color: rgba(255,255,255,0.25);
        }
        /* 图标 */
        .contact-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 16px;
            font-size: 1.2rem;
            flex-shrink: 0;
            color:#fff;
        }
        .icon-phone {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }
        .icon-email {
            background: linear-gradient(135deg, #f77062, #fe5196);
        }
        .icon-qq {
            background: linear-gradient(135deg, #2196F3, #03A9F4);
        }
        .icon-douyin {
            background: linear-gradient(135deg, #000000, #25F4EE);
        }
        .icon-kuaishou {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
        }
        .icon-wechat-mp {
            background: linear-gradient(135deg, #74b9ff, #00cec9);
        }
        /* 联系文字 */
        .contact-label {
            color: rgba(255, 255, 255, 0.62);
            font-size: 0.82rem;
            margin-bottom: 2px;
        }
        .contact-value {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.4px;
        }
        .contact-text {
            text-align: left;
        }
        /* Toast复制提示 */
        .toast {
            position: fixed;
            left: 50%;
            top: 48%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.65);
            color:#fff;
            padding:10px 22px;
            border-radius:8px;
            font-size:0.9rem;
            opacity:0;
            pointer-events:none;
            transition: opacity 0.25s ease;
            z-index:999;
        }
        .toast.show{
            opacity:1;
        }
        /* 底部 */
        .footer-text {
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.52);
            font-size: 0.82rem;
            letter-spacing: 2.5px;
        }
        /* 响应式 */
        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }
            .name {
                font-size: 1.7rem;
                letter-spacing:4px;
            }
            .avatar-wrapper{
                width:110px;
                height:110px;
            }
            .contact-item {
                padding:10px 14px;
            }
            .contact-icon{
                width:36px;
                height:36px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 头像 -->
        <div class="avatar-wrapper">
            <img src="avatar.png">
        </div>
        <!-- 标题 -->
        <h1>我的个人页面</h1>
        <!-- 分隔线 -->
        <div class="divider"></div>
        <!-- 名字 -->
        <div class="name">骆明辉</div>
        <!-- 个人简介 -->
        <div class="bio">
            <div class="bio-title">📋 个人简介（点击信息可复制）</div>
            <!-- 手机号 -->
            <div class="contact-item" data-copy="18054385320">
                <div class="contact-icon icon-phone">📞</div>
                <div class="contact-text">
                    <div class="contact-label">手机号</div>
                    <div class="contact-value">18054385320</div>
                </div>
            </div>
            <!-- 邮箱 -->
            <div class="contact-item" data-copy="mrldfy78@outlook.com">
                <div class="contact-icon icon-email">✉</div>
                <div class="contact-text">
                    <div class="contact-label">邮箱</div>
                    <div class="contact-value">mrldfy78@outlook.com</div>
                </div>
            </div>
            <!-- QQ -->
            <div class="contact-item" data-copy="3427668604">
                <div class="contact-icon icon-qq">Q</div>
                <div class="contact-text">
                    <div class="contact-label">QQ 号</div>
                    <div class="contact-value">3427668604</div>
                </div>
            </div>
            <!-- 抖音 -->
            <div class="contact-item" data-copy="93973297876">
                <div class="contact-icon icon-douyin">🎵</div>
                <div class="contact-text">
                    <div class="contact-label">抖音号</div>
                    <div class="contact-value">93973297876</div>
                </div>
            </div>
            <!-- 快手 -->
            <div class="contact-item" data-copy="m154dl666">
                <div class="contact-icon icon-kuaishou">K</div>
                <div class="contact-text">
                    <div class="contact-label">快手号</div>
                    <div class="contact-value">m154dl666</div>
                </div>
            </div>
            <!-- 微信公众号 -->
            <div class="contact-item" data-copy="zoxy象限">
                <div class="contact-icon icon-wechat-mp">🅆</div>
                <div class="contact-text">
                    <div class="contact-label">微信公众号</div>
                    <div class="contact-value">zoxy象限</div>
                </div>
            </div>
        </div>
        <!-- 底部 -->
        <div class="footer-text">Welcome to My Page ✦</div>
    </div>
    <!--复制提示弹窗-->
    <div class="toast">复制成功</div>
<script>
    const toast = document.querySelector('.toast');
    const items = document.querySelectorAll('.contact-item');
    function showToast(text){
        toast.innerText = text;
        toast.classList.add('show');
        setTimeout(()=>{
            toast.classList.remove('show');
        },1200);
    }
    items.forEach(item=>{
        item.addEventListener('click',async ()=>{
            const copyText = item.dataset.copy;
            try{
                await navigator.clipboard.writeText(copyText);
                showToast("复制成功 ✔");
            }catch(err){
                // 兼容旧浏览器降级方案
                const temp = document.createElement('textarea');
                temp.value = copyText;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                showToast("复制成功 ✔");
            }
        })
    })
</script>
</body>
</html>
